# The site is built from the four READMEs and the two guides in docs/ —
# scripts/build_docs.py turns them into pages. Nothing here is a second copy.
site_name: Scribe
site_description: Home Assistant history in TimescaleDB — states and events, recorded through asyncpg.
site_url: https://jonathan-gtd.github.io/scribe/
repo_url: https://github.com/jonathan-gtd/scribe
repo_name: jonathan-gtd/scribe
edit_uri: ""
copyright: MIT
# Generated by scripts/build_docs.py, which must run first.
docs_dir: site-src

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Light theme

nav:
  - Scribe: index.md
  - Français: fr.md
  - Español: es.md
  - Deutsch: de.md
  - Data structure: data-structure.md
  - Developing Scribe: DEVELOPMENT.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      # GitHub keeps accents in its anchors, and the French, Spanish and German
      # tables of contents link to them. The default slugifier strips them.
      slugify: !!python/name:pymdownx.slugs.uslugify
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search
