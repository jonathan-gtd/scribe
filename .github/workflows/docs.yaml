name: Documentation

# The site is the four READMEs and the two guides, built by
# scripts/build_docs.py and mkdocs. Building it on every pull request means a
# link that would 404 fails there, not after it is published.
on:
  push:
    branches: [master]
    paths:
      - "README*.md"
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/build_docs.py"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "README*.md"
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/build_docs.py"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true

      - run: pip install mkdocs-material

      - name: Assemble the pages
        run: python3 scripts/build_docs.py

      - name: Build
        # --strict: a broken link or a missing anchor fails the build.
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/master'
        with:
          path: site

  deploy:
    name: Publish
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
